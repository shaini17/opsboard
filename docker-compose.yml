services:
  database:
    image: postgres:16-alpine
    container_name: opsboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: opsboard
      POSTGRES_USER: opsboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsboard -d opsboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: shaini17/opsboard-backend:latest
    container_name: opsboard-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: opsboard
      DB_USER: opsboard
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: shaini17/opsboard-frontend:latest
    container_name: opsboard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
